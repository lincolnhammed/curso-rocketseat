
spring:
  application:
    name: todolist
  datasource:
    url: jdbc:mysql://localhost:3306/cursoRocketseat?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:root}
    # driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      #ddl-auto: create-drop
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true